services:
  postgis:
    image: imresamu/postgis:16-3.5
    container_name: joicrememory-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: joicrememory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - joicrememory-postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d joicrememory"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  joicrememory-postgis-data:
